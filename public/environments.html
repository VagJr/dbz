<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe Z · Paisagens vivas</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1720;color:#e4eee6;font:14px system-ui}header{position:fixed;z-index:1;top:16px;left:16px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px;background:#10212de8;border:1px solid #bddaca30;border-radius:16px}a{color:#badeb1}select,button{background:#263e49;color:#eef5e6;border:1px solid #92b6a955;padding:9px;border-radius:8px}canvas{display:block}small{opacity:.7}</style><header><b>UNIVERSE Z · Paisagens vivas</b><select id="planet" aria-label="Planeta"></select><select id="landmark" aria-label="Lugar icônico"><option value="">Lugares icônicos</option></select><button id="village">Vila e montanhas</button><button id="water">Rio e cachoeira</button><button id="motion">Pausar animação</button><a href="/">Voltar ao jogo</a><small>Arraste para explorar · roda para aproximar</small></header><canvas id="view"></canvas><script src="/shared/content.js"></script><script src="/shared/open-world.js"></script><script src="/shared/lore.js"></script><script>window.Art={};window.FlightUI={update(){}};</script><script src="/open-world-art.js"></script><script src="/lore-art.js"></script><script>
const canvas=document.getElementById('view'),c=canvas.getContext('2d'),select=document.getElementById('planet'),renderer={world:'earth',cam:{x:2200,y:2400},reduced:false};let zoom=.7,drag=null;
for(const w of UZ.WORLDS)select.add(new Option(w.name,w.id));
const landmark=document.getElementById('landmark');for(const s of UZLore.sites)landmark.add(new Option(s.name,s.id));landmark.onchange=()=>{const s=UZLore.sites.find(s=>s.id===landmark.value);if(s){renderer.world=s.world;select.value=s.world;renderer.cam={x:s.x,y:s.y};}};
function village(){const s=UZOpenWorld.chunk(renderer.world,1,1).site;renderer.cam={x:s.x,y:s.y};}village();
select.onchange=()=>{renderer.world=select.value;village()};document.getElementById('village').onclick=village;document.getElementById('water').onclick=()=>renderer.cam={x:4100+Math.sin(2800/1700)*1100+Math.sin(2800/620)*180,y:2800};
document.getElementById('motion').onclick=e=>{renderer.reduced=!renderer.reduced;e.target.textContent=renderer.reduced?'Retomar animação':'Pausar animação'};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;renderer.cam.x-=(e.clientX-drag.x)/zoom;renderer.cam.y-=(e.clientY-drag.y)/zoom;drag={x:e.clientX,y:e.clientY}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(1.4,zoom-e.deltaY*.001))};
function draw(t){const d=Math.min(devicePixelRatio,2),w=innerWidth,h=innerHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);canvas.style.width=w+'px';canvas.style.height=h+'px'}c.setTransform(d*zoom,0,0,d*zoom,d*(w/2-renderer.cam.x*zoom),d*(h/2-renderer.cam.y*zoom));Art.openTerrain(c,renderer,{},t/1000,w/zoom,h/zoom);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
